[package]
name = "execenv"
version = "0.2.0"
edition = "2021"
rust-version = "1.93.0"
description = "Securely decrypt config files in memory and inject as env vars via execve"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
serde_json = "1"
nix = { version = "0.29", features = ["process"] }
zeroize = { version = "1", features = ["derive"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-secretsmanager = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
nix        = { version = "0.29", features = ["process"] }

[profile.release]
strip = true
lto = true
